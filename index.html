<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krasbike</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            padding: 25px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚲 Krasbike</h1>
    <p>Управление арендой</p>

    <div class="card">
        <h2>Ваша аренда</h2>

        <p>Статус: <b>Активна</b></p>
        <p>До окончания: <b>3 дня</b></p>

        <button onclick="alert('Здесь будет оплата')">
            Продлить аренду
        </button>
    </div>

</div>

</body>
</html>
