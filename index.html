<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krasbike</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }
        .container {
            padding: 25px 20px;
        }
        h1 {
            margin-bottom: 5px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }
        .row {
            margin: 12px 0;
        }
        .label {
            color: #777;
            font-size: 14px;
        }
        .value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 16px;
            margin-top: 15px;
        }
        .error {
            color: #c00;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚲 Krasbike</h1>
    <p>Управление арендой</p>
    <div class="card">
        <h2>Ваша аренда</h2>
        <div class="row">
            <div class="label">Курьер</div>
            <div class="value" id="courierName">Загрузка...</div>
        </div>
        <div class="row">
            <div class="label">Транспорт</div>
            <div class="value" id="vehicleName">Загрузка...</div>
        </div>
        <div class="row">
            <div class="label">Стоимость аренды</div>
            <div class="value" id="rentAmount">Загрузка...</div>
        </div>
        <div class="row">
            <div class="label">Оплатить до</div>
            <div class="value" id="paymentDate">Загрузка...</div>
        </div>
        <div class="row">
            <div class="label">Статус</div>
            <div class="value" id="status">Загрузка...</div>
        </div>
        <button onclick="alert('Оплата СБП будет подключена следующим шагом')">
            Продлить аренду
        </button>
    </div>
    <p id="error" class="error"></p>
</div>
<script>
const SUPABASE_URL =
    "https://vvrbnotkgmwtdisplyvz.supabase.co";
const SUPABASE_KEY =
    "sb_publishable_ymax_375gKPKltpGrH4X4A__GcbwV2D";
const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function loadRental() {
    try {
        const { data: courier, error: courierError } =
            await supabaseClient
                .from("couriers")
                .select("*")
                .limit(1)
                .single();
        if (courierError) throw courierError;
        document.getElementById("courierName").textContent =
            courier.name || "Курьер";
        const { data: rental, error: rentalError } =
            await supabaseClient
                .from("rentals")
                .select("*")
                .eq("courier_id", courier.id)
                .eq("status", "active")
                .limit(1)
                .single();
        if (rentalError) throw rentalError;
        document.getElementById("rentAmount").textContent =
            (rental.rent_amount || 0) + " ₽";
        document.getElementById("paymentDate").textContent =
            rental.payment_due_date || "Не указано";
        document.getElementById("status").textContent =
            rental.status === "active"
                ? "Активна"
                : rental.status;
        if (rental.vehicle_id) {
            const { data: vehicle, error: vehicleError } =
                await supabaseClient
                    .from("vehicles")
                    .select("*")
                    .eq("id", rental.vehicle_id)
                    .single();
            if (vehicleError) throw vehicleError;
            document.getElementById("vehicleName").textContent =
                vehicle.name ||
                vehicle.model ||
                "Транспорт";
        } else {
            document.getElementById("vehicleName").textContent =
                "Не назначен";
        }
    } catch (error) {
        console.error(error);
        document.getElementById("error").textContent =
            "Не удалось загрузить данные.";
    }
}
loadRental();
</script>
</body>
</html>
